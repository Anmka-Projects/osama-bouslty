name: educational_app
description: Educational Mobile App - Flutter Native Migration
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  carousel_slider: ^5.0.0
  crypto: ^3.0.3
  device_info_plus: ^10.1.0
  dio: ^5.4.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  flutter_localizations:
    sdk: flutter
  flutter_pdfview: ^1.4.3
  flutter_svg: ^2.0.9
  go_router: ^14.0.0
  google_fonts: ^7.0.0
  google_sign_in: ^6.2.2
  http: ^1.1.0
  file_picker: ^8.1.4
  image_picker: ^1.0.7
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.1
  permission_handler: ^11.2.0
  pod_player: ^0.2.2
  qr_flutter: ^4.1.0
  screen_protector: ^1.3.0
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^7.0.1
  fl_chart: ^0.69.0
  skeletonizer: null
  sqflite: ^2.3.0
  url_launcher: ^6.1.0
  timezone: ^0.9.4
  video_player: ^2.8.0
  webview_flutter: ^4.4.2
  socket_io_client_new: ^1.0.3
  youtube_explode_dart: ^2.5.3

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/brand/app-icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#083B41"
  adaptive_icon_foreground: "assets/images/brand/ic_launcher_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/brand/
  #  - assets/icons/
  # Bouslty brand fonts (Alexandria + Readex Pro) load via google_fonts
  # No need to include font files manually
